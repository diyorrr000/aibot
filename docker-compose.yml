version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tg_business_postgres
    restart: always
    environment:
      POSTGRES_USER: tg_user
      POSTGRES_PASSWORD: tg_password
      POSTGRES_DB: tg_business_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_user -d tg_business_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: tg_business_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgresql+asyncpg://tg_user:tg_password@postgres:5432/tg_business_db
      DEFAULT_MODEL: claude
      RATE_LIMIT_SECONDS: 1.5
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
